<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Western Village</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #1a1a1a;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        justify-content: center;
      }
      #building-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: #111318;
        border-top: 2px solid #333;
        font-family: sans-serif;
      }
      #building-bar .money {
        color: #ffd54f;
        font-weight: bold;
        margin-right: 12px;
        min-width: 90px;
      }
      #building-bar button {
        background: #2b2f38;
        color: #fff;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 13px;
        cursor: pointer;
      }
      #building-bar button:hover {
        background: #3a3f4b;
      }
      #building-bar button.active {
        background: #4caf50;
        border-color: #4caf50;
      }
      #building-info-panel {
        position: fixed;
        right: 16px;
        bottom: 88px;
        background: #111318ee;
        color: #fff;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 10px 14px;
        font-family: sans-serif;
        font-size: 13px;
        min-width: 180px;
      }
      #building-info-panel strong {
        font-size: 14px;
      }
      #building-info-panel div {
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
