<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Western Village</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #2b1d12;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        justify-content: center;
      }
      #building-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: #3e2b1f;
        border-top: 2px solid #8d6e4a;
        font-family: sans-serif;
      }
      #building-bar .money {
        color: #ffd54f;
        font-weight: bold;
        margin-right: 12px;
        min-width: 90px;
      }
      #building-bar button {
        background: #5b3a29;
        color: #f2e6d8;
        border: 1px solid #8d6e4a;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
      }
      #building-bar button:hover {
        background: #714a35;
        transform: translateY(-1px);
      }
      #building-bar button.active {
        background: #4caf50;
        border-color: #4caf50;
      }
      #building-info-panel {
        position: fixed;
        right: 16px;
        bottom: 88px;
        background: #2b1d12ee;
        color: #f2e6d8;
        border: 1px solid #8d6e4a;
        border-radius: 6px;
        padding: 10px 14px;
        font-family: sans-serif;
        font-size: 13px;
        min-width: 180px;
      }
      #building-info-panel strong {
        font-size: 14px;
      }
      #building-info-panel div {
        margin-top: 4px;
      }
      #game-over-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        font-family: sans-serif;
      }
      #game-over-overlay[hidden] {
        display: none;
      }
      #game-over-panel {
        background: #2b1d12;
        color: #f2e6d8;
        border: 1px solid #8d6e4a;
        border-radius: 8px;
        padding: 24px 32px;
        min-width: 260px;
        text-align: center;
      }
      #game-over-panel h2 {
        margin-top: 0;
      }
      #game-over-panel .stat {
        color: #ffd54f;
        font-weight: bold;
        margin: 8px 0;
      }
      #game-over-panel h3 {
        margin-bottom: 4px;
        font-size: 13px;
        color: #aaa;
      }
      #game-over-panel div {
        font-size: 13px;
      }
      #game-over-panel button {
        margin-top: 16px;
        background: #4caf50;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      #game-over-panel button:hover {
        background: #5cbf60;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
