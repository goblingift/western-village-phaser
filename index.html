<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Western Village</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #2b1d12;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        justify-content: center;
      }
      #building-bar {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 12px;
        background: #3e2b1f;
        border-top: 2px solid #8d6e4a;
        font-family: sans-serif;
        width: 960px;
        max-width: 100vw;
        box-sizing: border-box;
      }
      #building-bar .bar-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      #building-bar .money {
        color: #ffd54f;
        font-weight: bold;
        min-width: 70px;
      }
      #building-bar button {
        background: #5b3a29;
        color: #f2e6d8;
        border: 1px solid #8d6e4a;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
      }
      #building-bar button:hover {
        background: #714a35;
        transform: translateY(-1px);
      }
      #building-bar button.active {
        background: #4caf50;
        border-color: #4caf50;
      }
      #building-bar button.tab {
        font-size: 12px;
        padding: 5px 8px;
      }
      #building-bar button.danger {
        background: #7f3b2f;
        border-color: #c05a45;
      }
      #building-bar button.danger.active {
        background: #c62828;
        border-color: #ff8a80;
      }
      #building-bar .speed-group {
        display: flex;
        gap: 4px;
        margin-left: auto;
      }
      #building-bar button.speed {
        min-width: 34px;
        padding: 5px 6px;
        font-size: 12px;
      }
      /* Phase 52: Load button disabled state - no manual save exists yet. */
      #building-bar button.speed:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      /* The speed group takes margin-left:auto to push the right-hand controls
         over; the audio group follows it, so it must not claim that margin
         again or it would push itself onto its own edge. */
      #building-bar .audio-group {
        margin-left: 8px;
        align-items: center;
      }
      #building-bar .volume {
        width: 72px;
        accent-color: #c9a063;
      }
      /* Phase 59: music/ambience volume slider - same chrome as the SFX
         slider, distinguished by accent color so the two are tellable apart
         at a glance without needing a text label in the cramped top row. */
      #building-bar .volume.music-volume {
        accent-color: #8a6fb0;
      }
      #building-bar .building-panel {
        min-height: 52px;
      }
      #building-bar button.building-button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 4px 8px;
        min-width: 74px;
      }
      #building-bar button.building-button .icon {
        width: 28px;
        height: 28px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        image-rendering: pixelated;
      }
      /* Until the atlas icons arrive the slot stays empty and the text label
         alone carries the button, so the bar is never unusable. */
      #building-bar button.building-button .icon:not(.has-image) {
        height: 0;
      }
      #building-bar button.building-button .label {
        font-size: 11px;
        line-height: 1.1;
      }
      #building-bar button.building-button .cost {
        font-size: 10px;
        color: #ffd54f;
      }
      #building-bar button.building-button.unaffordable {
        opacity: 0.4;
      }
      #building-bar button.building-button.unaffordable .cost {
        color: #ef5350;
      }
      /* Phase 47: locked (milestone not yet reached) is a distinct state from
         unaffordable (money/materials short but placeable) - greyscale plus a
         lock badge instead of the plain dim, and clicking it does nothing
         (see BuildingBar.onButtonClick), so it must read as unclickable at a
         glance. */
      #building-bar button.building-button.locked {
        position: relative;
        opacity: 0.35;
        filter: grayscale(1);
        cursor: not-allowed;
      }
      #building-bar button.building-button.locked::after {
        content: '\1F512';
        position: absolute;
        top: 1px;
        right: 3px;
        font-size: 11px;
      }
      /* The canvas gets its own positioned wrapper so in-game overlays anchor
         to the play area instead of the viewport - the building bar's height
         changes with its content, and a viewport-anchored panel ended up
         sitting on top of it (and swallowing its clicks). */
      #stage {
        position: relative;
      }
      /* Block display (rather than line-height:0 on the wrapper) removes the
         canvas's inline-element descender gap without imposing a zero
         line-height on the overlays that live inside #stage. */
      #stage canvas {
        display: block;
      }
      /* Phase 48: hover tooltip for ResourceHudPanel's icon grid - a Phaser
         canvas widget can't use the building bar's native `title`-attribute
         trick, so this is a small positioned DOM element instead, following
         the same dark-panel look as #building-info-panel. pointer-events:none
         so it never itself blocks the Phaser Zone underneath the cursor. */
      #resource-tooltip {
        position: absolute;
        z-index: 1500;
        pointer-events: none;
        background: #2b1d12ee;
        color: #f2e6d8;
        border: 1px solid #8d6e4a;
        border-radius: 6px;
        padding: 8px 10px;
        font-family: sans-serif;
        font-size: 12px;
        max-width: 240px;
        line-height: 1.4;
      }
      #resource-tooltip strong {
        font-size: 13px;
        color: #ffd54f;
      }
      #resource-tooltip .hint {
        color: #8d7f6e;
        font-size: 11px;
        margin-top: 4px;
      }
      #building-info-panel {
        position: absolute;
        right: 16px;
        bottom: 16px;
        max-height: 70%;
        overflow-y: auto;
        background: #2b1d12ee;
        color: #f2e6d8;
        border: 1px solid #8d6e4a;
        border-radius: 6px;
        padding: 10px 14px;
        font-family: sans-serif;
        font-size: 13px;
        min-width: 180px;
      }
      #building-info-panel strong {
        font-size: 14px;
      }
      #building-info-panel div {
        margin-top: 4px;
      }
      #building-info-panel button {
        margin-top: 6px;
        background: #4caf50;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 13px;
        cursor: pointer;
      }
      #building-info-panel button:hover:not(:disabled) {
        background: #5cbf60;
      }
      #building-info-panel button:disabled {
        background: #5b3a29;
        color: #a99;
        cursor: not-allowed;
      }
      #building-info-panel .hint {
        color: #d08a6a;
        font-size: 12px;
        margin-top: 2px;
      }
      #building-info-panel .hp-disabled {
        color: #ff5252;
        font-weight: bold;
      }
      #building-info-panel button.danger {
        background: #7f3b2f;
      }
      #building-info-panel button.danger:hover:not(:disabled) {
        background: #c62828;
      }
      /* Phase 42: worker priority tier buttons - a compact row, not the
         panel's usual full-width action buttons. */
      #building-info-panel .priority-row {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 6px;
        font-size: 12px;
      }
      #building-info-panel button.priority-button {
        margin-top: 0;
        background: #5b3a29;
        padding: 4px 8px;
        font-size: 12px;
      }
      #building-info-panel button.priority-button:hover:not(.active) {
        background: #714a35;
      }
      #building-info-panel button.priority-button.active {
        background: #4caf50;
      }
      /* Phase 51: Trading Post per-resource order rows - toggle + label +
         two small number inputs, one row per marketable resource. */
      #building-info-panel .trade-order-row {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
        font-size: 12px;
      }
      #building-info-panel .trade-order-row span {
        flex: 1;
      }
      #building-info-panel input.trade-order-input {
        width: 44px;
        background: #1d130c;
        color: #f2e6d8;
        border: 1px solid #8d6e4a;
        border-radius: 3px;
        padding: 2px 4px;
        font-size: 12px;
      }
      /* Phase 44: notification log feed, opposite corner from
         #building-info-panel so the two never overlap. */
      #notification-log-panel {
        position: absolute;
        left: 16px;
        bottom: 16px;
        width: 280px;
        max-width: calc(100vw - 32px);
        max-height: 220px;
        display: flex;
        flex-direction: column;
        background: #2b1d12ee;
        color: #f2e6d8;
        border: 1px solid #8d6e4a;
        border-radius: 6px;
        font-family: sans-serif;
        font-size: 12px;
        overflow: hidden;
      }
      #notification-log-panel .notification-log-header {
        padding: 6px 10px;
        font-weight: bold;
        background: #3e2b1f;
        border-bottom: 1px solid #8d6e4a;
        cursor: pointer;
        user-select: none;
      }
      #notification-log-panel .notification-log-list {
        overflow-y: auto;
        padding: 4px 10px;
      }
      #notification-log-panel .notification-log-entry {
        padding: 3px 0;
        border-bottom: 1px solid #4a3626;
        line-height: 1.35;
      }
      #notification-log-panel .notification-log-entry:last-child {
        border-bottom: none;
      }
      #notification-log-panel .notification-log-entry.clickable {
        cursor: pointer;
      }
      #notification-log-panel .notification-log-entry.clickable:hover {
        text-decoration: underline;
      }
      #notification-log-panel .notification-log-empty {
        color: #8d7f6e;
        padding: 6px 0;
      }
      /* Phase 56: Objectives / Quest Chain - a small, always-on, non-
         interactive widget docked top-center of #stage. Every other corner is
         already spoken for (ResourceHudPanel/minimap top-left on the canvas,
         BuildingInfoPanel bottom-right, NotificationLogPanel bottom-left,
         StatisticsPanel top-right-but-hidden-by-default), so top-center is the
         one glanceable spot left; pointer-events:none like #resource-tooltip
         since it's a read-only readout, not a clickable panel. */
      #objectives-panel {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100vw - 340px);
        pointer-events: none;
        background: #2b1d12ee;
        color: #f2e6d8;
        border: 1px solid #8d6e4a;
        border-radius: 6px;
        font-family: sans-serif;
        font-size: 12px;
        overflow: hidden;
      }
      #objectives-panel .objectives-panel-header {
        padding: 5px 10px;
        font-weight: bold;
        color: #ffd54f;
        background: #3e2b1f;
        border-bottom: 1px solid #8d6e4a;
      }
      #objectives-panel .objectives-panel-list {
        padding: 4px 10px;
      }
      #objectives-panel .objectives-panel-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 3px 0;
        border-bottom: 1px solid #4a3626;
        line-height: 1.35;
      }
      #objectives-panel .objectives-panel-row:last-child {
        border-bottom: none;
      }
      #objectives-panel .objectives-panel-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #objectives-panel .objectives-panel-value {
        color: #8bc34a;
        font-weight: bold;
        white-space: nowrap;
      }
      #objectives-panel .objectives-panel-empty {
        color: #8d7f6e;
        padding: 6px 0;
      }
      /* Phase 49: Statistics & Efficiency panel - opt-in, hidden by default
         (toggled by the 'V' hotkey / building bar's Stats button), anchored
         top-right so it never collides with the info panel (bottom-right) or
         the notification log (bottom-left). */
      #statistics-panel {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 320px;
        max-width: calc(100vw - 32px);
        max-height: 80%;
        overflow-y: auto;
        background: #2b1d12ee;
        color: #f2e6d8;
        border: 1px solid #8d6e4a;
        border-radius: 6px;
        font-family: sans-serif;
        font-size: 12px;
        padding: 0 0 8px;
      }
      #statistics-panel .statistics-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        font-weight: bold;
        font-size: 13px;
        background: #3e2b1f;
        border-bottom: 1px solid #8d6e4a;
        border-radius: 6px 6px 0 0;
      }
      #statistics-panel .statistics-panel-close {
        background: transparent;
        color: #f2e6d8;
        border: none;
        cursor: pointer;
        font-size: 13px;
        padding: 0 2px;
      }
      #statistics-panel .statistics-panel-section-title {
        padding: 8px 10px 4px;
        color: #d7b98e;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      #statistics-panel .statistics-panel-sort-heading {
        cursor: pointer;
        user-select: none;
      }
      #statistics-panel .statistics-panel-sort-heading:hover {
        color: #ffd54f;
      }
      #statistics-panel .statistics-panel-resources {
        padding: 0 10px;
      }
      #statistics-panel .statistics-panel-resource-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
        border-bottom: 1px solid #4a3626;
      }
      #statistics-panel .statistics-panel-resource-row:last-child {
        border-bottom: none;
      }
      #statistics-panel .statistics-panel-resource-label {
        flex: 0 0 70px;
      }
      #statistics-panel .statistics-panel-sparkline {
        flex: 0 0 auto;
        background: #1f150d;
        border-radius: 2px;
      }
      #statistics-panel .statistics-panel-resource-value {
        flex: 1 1 auto;
        text-align: right;
        font-size: 11px;
        color: #cbbfaf;
      }
      #statistics-panel .statistics-panel-resource-value.positive {
        color: #8bc34a;
      }
      #statistics-panel .statistics-panel-resource-value.negative {
        color: #ef5350;
      }
      #statistics-panel .statistics-panel-buildings {
        padding: 0 10px;
      }
      #statistics-panel .statistics-panel-building-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
        border-bottom: 1px solid #4a3626;
        font-size: 11px;
      }
      #statistics-panel .statistics-panel-building-row:last-child {
        border-bottom: none;
      }
      #statistics-panel .statistics-panel-building-label {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #statistics-panel .statistics-panel-building-percent {
        flex: 0 0 36px;
        text-align: right;
        font-weight: bold;
      }
      #statistics-panel .statistics-panel-building-percent.good {
        color: #8bc34a;
      }
      #statistics-panel .statistics-panel-building-percent.ok {
        color: #ffca28;
      }
      #statistics-panel .statistics-panel-building-percent.bad {
        color: #ef5350;
      }
      #statistics-panel .statistics-panel-building-reason {
        flex: 0 0 110px;
        text-align: right;
        color: #d08a6a;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #statistics-panel .statistics-panel-empty {
        color: #8d7f6e;
        padding: 6px 0;
      }
      #game-over-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        font-family: sans-serif;
      }
      #game-over-overlay[hidden] {
        display: none;
      }
      #game-over-panel {
        background: #2b1d12;
        color: #f2e6d8;
        border: 1px solid #8d6e4a;
        border-radius: 8px;
        padding: 24px 32px;
        min-width: 260px;
        text-align: center;
      }
      #game-over-panel h2 {
        margin-top: 0;
      }
      #game-over-panel .stat {
        color: #ffd54f;
        font-weight: bold;
        margin: 8px 0;
      }
      #game-over-panel h3 {
        margin-bottom: 4px;
        font-size: 13px;
        color: #aaa;
      }
      #game-over-panel div {
        font-size: 13px;
      }
      #game-over-panel button {
        margin-top: 16px;
        background: #4caf50;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      #game-over-panel button:hover {
        background: #5cbf60;
      }
      /* Phase 39: difficulty/mode picker shown before a run starts (and again
         between a game-over and the next Start click), sharing the game-over
         overlay's full-screen dimmed backdrop for visual consistency. */
      #difficulty-select-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        font-family: sans-serif;
      }
      #difficulty-select-overlay[hidden] {
        display: none;
      }
      #difficulty-select-panel {
        background: #2b1d12;
        color: #f2e6d8;
        border: 1px solid #8d6e4a;
        border-radius: 8px;
        padding: 24px 32px;
        min-width: 320px;
        text-align: center;
      }
      #difficulty-select-panel h2 {
        margin-top: 0;
      }
      #difficulty-select-panel h3 {
        margin-bottom: 4px;
        font-size: 13px;
        color: #aaa;
      }
      #difficulty-select-panel .stat {
        color: #ffd54f;
        font-size: 12px;
        margin: 4px 0 12px;
      }
      #difficulty-select-panel .option-row {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      #difficulty-select-panel button.option-button {
        background: #5b3a29;
        color: #f2e6d8;
        border: 1px solid #8d6e4a;
        border-radius: 4px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      #difficulty-select-panel button.option-button:hover {
        background: #714a35;
      }
      #difficulty-select-panel button.option-button.active {
        background: #4caf50;
        border-color: #4caf50;
      }
      #difficulty-select-panel button#start-run-button {
        margin-top: 16px;
        background: #4caf50;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      #difficulty-select-panel button#start-run-button:hover {
        background: #5cbf60;
      }
      /* Phase 52: Save/Load - "Continue" sits above the difficulty/mode
         pickers (it skips them entirely) and gets its own accent color so it
         reads as a distinct action from "Start New Game" below. */
      #difficulty-select-panel button#continue-run-button {
        display: block;
        width: 100%;
        margin-bottom: 16px;
        background: #2979ff;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      #difficulty-select-panel button#continue-run-button:hover {
        background: #448aff;
      }
    </style>
  </head>
  <body>
    <div id="app"><div id="stage"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
